[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandmuon"
version = "0.1.0"
description = "Standalone diagonal sensitivity-weighted Muon optimizer with eager FP32 S8 reference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hamza Kharbouch" }]
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["sandmuon*"]

[project.urls]
Repository = "https://github.com/pxike/SandMuon"
